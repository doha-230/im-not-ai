name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # This repo is stdlib-only; pytest is the sole test dependency.
      - run: pip install pytest
      - run: pytest tests/ -v
      # quick-rules.md가 taxonomy(SSOT)에서 재생성한 것과 일치하는지 검사.
      # 손으로 고쳤거나 taxonomy 수정 후 재생성을 잊으면 여기서 막힌다.
      - run: python3 scripts/build_quick_rules.py --check
      # diagnosis-rules.md(진단 전용 슬림 인덱스)도 동일한 drift 검사.
      - run: python3 scripts/build_diagnosis_rules.py --check
      # install.sh 플래그 동작(--dry-run 기반). pytest가 .sh 파일은 수집하지 않아
      # 지금까지 CI에서 한 번도 실행된 적이 없다.
      - run: bash tests/test_install_flags.sh
      # 격리 환경 실설치 스모크. 위 flags 테스트는 --dry-run 이라 실제 설치 경로를
      # 밟지 않는다. 그 공백에서 릴리스 두 건이 통째로 패치 회차로 나갔다(#71·#59·
      # v2.3.2 — 셋 다 사용자가 대신 밟았다). .sh 라 pytest 가 수집하지 않으므로
      # 여기서 명시 실행한다 — 이 줄이 없으면 머지돼 있어도 영원히 안 돌아간다.
      # CLAUDE_HOME/CODEX_HOME 을 mktemp 로 덮고 --no-gemini 로 실행하므로
      # 러너의 실제 홈은 건드리지 않는다.
      - run: bash tests/test_install_smoke.sh

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyinstaller
      # 실제 Windows PowerShell 5.1로 exe를 빌드한다.
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/build-portable.ps1 -SkipInstall -Zip
      # 더미 OpenAI 호환 서버에 exe와 PowerShell 실행기를 각각 연결한다.
      - run: python -m pytest -q tests/test_local_runner.py
        env:
          HUMANIZE_KOREAN_EXE: dist/humanize-korean/humanize-korean.exe
      - run: |
          if (-not (Test-Path dist/humanize-korean/README.md)) { throw "README.md missing from portable folder" }
          if (-not (Test-Path dist/humanize-korean/LICENSE)) { throw "LICENSE missing from portable folder" }
      - uses: actions/upload-artifact@v4
        with:
          name: humanize-korean-windows-onedir
          path: dist/humanize-korean-windows-onedir.zip
          if-no-files-found: error
